name: Validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 3-6,8-11 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "30 15 * * *"
    - cron: "30 21 12,28-31 * *"
    - cron: "30 2 1,13 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy, collect, apply approved saved evidence without HTTP, or probe
        type: choice
        options:
          - deploy
          - collect
          - personal
          - both
          - schedule
          - apply-saved
          - cost-sync
          - probe
        default: deploy
      saved_manifest:
        description: Approved bounded data-only JSON for apply-saved (expected main/state SHA required)
        type: string
        default: ""
      continuation_state:
        description: Saved checkpoint SHA from a successfully published finite collection chain
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate-site
      - name: Verify public staging
        run: python tools/pages.py stage --output _site --revision "$(git rev-parse HEAD)"

  probe:
    name: Verify public HTTP collection
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unseeded search and individual post metadata
        run: python tools/pages.py probe --report _probe-report.json

  collect:
    name: Collect with durable state
    if: >-
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'collect' || inputs.mode == 'personal' || inputs.mode == 'both' || inputs.mode == 'schedule' ||
         inputs.mode == 'apply-saved' || inputs.mode == 'cost-sync')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    outputs:
      continuation_ready: ${{ steps.collection.outputs.continuationReady }}
      state_commit: ${{ steps.collection.outputs.stateCommit }}
      continuation_mode: ${{ steps.collection.outputs.continuationMode }}
    steps:
      # A queued collector must use current code, not the old triggering commit.
      - name: Check out current production code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Route the triggering event without using the runner clock
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export RUN_CREATED_AT
          python tools/collection-routing.py
          echo "RUN_CREATED_AT=$RUN_CREATED_AT" >> "$GITHUB_ENV"
      - name: Install declared image collection dependencies
        if: steps.route.outputs.halfMonthCacheRequired == 'true'
        run: python -m pip install --disable-pip-version-check -r tools/requirements-collection.txt
      - name: Restore encrypted schedule evidence outside the checkout
        if: steps.route.outputs.halfMonthCacheRequired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_EVIDENCE_KEY: ${{ secrets.SCHEDULE_EVIDENCE_KEY }}
        run: |
          python tools/schedule-cache-artifact.py --output "$RUNNER_TEMP/schedule-evidence.zip"
          if [[ -f "$RUNNER_TEMP/schedule-evidence.zip" ]]; then
            python tools/restore-schedule-cache.py --archive "$RUNNER_TEMP/schedule-evidence.zip" --cache-dir "$RUNNER_TEMP/_private-evidence"
          fi
      - name: Authenticate read-only Azure cost access
        id: azure-cost-login
        if: >-
          steps.route.outputs.collectionMode != 'apply-saved' &&
          vars.AZURE_COST_CLIENT_ID != '' && vars.AZURE_COST_TENANT_ID != '' &&
          vars.AZURE_COST_SUBSCRIPTION_ID != ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_COST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_COST_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_COST_SUBSCRIPTION_ID }}
      - name: Collect with durable state
        id: collection
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_COST_CLIENT_ID: ${{ vars.AZURE_COST_CLIENT_ID }}
          AZURE_COST_TENANT_ID: ${{ vars.AZURE_COST_TENANT_ID }}
          AZURE_COST_SUBSCRIPTION_ID: ${{ vars.AZURE_COST_SUBSCRIPTION_ID }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          COLLECTION_MODE: ${{ steps.route.outputs.collectionMode }}
          COLLECTION_KIND: ${{ steps.route.outputs.collectionKind }}
          COLLECTION_SLOT: ${{ steps.route.outputs.collectionSlot }}
          COLLECTION_SLOT_ID: ${{ steps.route.outputs.collectionSlotId }}
          COLLECTION_DATE: ${{ steps.route.outputs.collectionDate }}
          CONTINUATION_STATE: ${{ inputs.continuation_state }}
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          APPLY_SAVED_MANIFEST: ${{ inputs.saved_manifest }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
          SCHEDULE_EVIDENCE_CACHE: ${{ runner.temp }}/_private-evidence/cache.bin
          SCHEDULE_EVIDENCE_KEY: ${{ steps.route.outputs.halfMonthCacheRequired == 'true' && secrets.SCHEDULE_EVIDENCE_KEY || '' }}
          # Cloud strips Azure configuration from Git, restore, and all non-AI children.
          PERSONAL_ANALYSIS_BACKEND: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both') && 'azure' || 'rules' }}
          AZURE_OPENAI_API_KEY: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && secrets.AZURE_OPENAI_API_KEY || '' }}
          AZURE_OPENAI_ENDPOINT: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && vars.AZURE_OPENAI_ENDPOINT || '' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && vars.AZURE_OPENAI_DEPLOYMENT || '' }}
        run: python tools/cloud-collection.py --mode "$COLLECTION_MODE" --output data/observed-shifts.json --recovery-dir _recovery-state
      - name: Detect encrypted checkpoint for retention
        id: evidence
        if: always() && steps.route.outputs.halfMonthCacheRequired == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/_private-evidence/cache.bin" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve only encrypted schedule evidence
        if: always() && steps.evidence.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: schedule-evidence-encrypted-v1
          path: ${{ runner.temp }}/_private-evidence/cache.bin
          retention-days: 7
          if-no-files-found: error
      - name: Warn when verified data is published with incomplete collection
        if: >-
          steps.collection.outputs.collectionStatus == 'partial' ||
          steps.collection.outputs.collectionStatus == 'unavailable' ||
          steps.collection.outputs.personalCollectionStatus == 'paused' ||
          steps.collection.outputs.personalCollectionStatus == 'budget-exhausted' ||
          steps.collection.outputs.halfMonthCollectionStatus == 'paused' ||
          steps.collection.outputs.halfMonthCollectionStatus == 'budget-exhausted'
        run: echo "::warning::Collection was incomplete or paused; only saved, verified facts will be published."
      - name: Preserve data for explicit recovery after a failure
        if: failure() && hashFiles('_recovery-state/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: collector-recovery-${{ github.run_id }}
          path: _recovery-state
          retention-days: 30

  build:
    name: Validate and stage current production site
    needs: collect
    outputs:
      continuation_ready: ${{ steps.restore.outputs.continuationReady }}
      state_commit: ${{ steps.restore.outputs.stateCommit }}
      continuation_mode: ${{ steps.restore.outputs.continuationMode }}
    if: >-
      always() && !cancelled() &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'deploy' || inputs.mode == 'collect' ||
         inputs.mode == 'personal' || inputs.mode == 'both' || inputs.mode == 'schedule' || inputs.mode == 'apply-saved'))) &&
      (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Restore latest observations for every deployment
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
        run: python tools/cloud-collection.py --mode restore --output data/observed-shifts.json
      - uses: ./.github/actions/validate-site
      - name: Stage only public frontend files
        run: python tools/pages.py stage --output _site --revision "$(git rev-parse HEAD)"
      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy static site
    needs: build
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      inputs.mode != 'probe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the artifact validated in this run
        id: deployment
        uses: actions/deploy-pages@v4

  continue-collection:
    name: Continue a published finite checkpoint
    needs: [collect, build, deploy]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.collect.result == 'success' || needs.collect.result == 'skipped') &&
      needs.deploy.result == 'success' &&
      needs.build.outputs.continuation_ready == 'true' &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the published checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_SHA: ${{ needs.build.outputs.state_commit }}
          CONTINUATION_MODE: ${{ needs.build.outputs.continuation_mode }}
        run: |
          [[ "$CHECKPOINT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CONTINUATION_MODE" == "personal" || "$CONTINUATION_MODE" == "both" || "$CONTINUATION_MODE" == "schedule" ]] || exit 1
          for STATUS in queued pending waiting; do
            COUNT="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs?branch=main&status=$STATUS&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .event != \"pull_request\")] | length" |
              awk '{ total += $1 } END { print total + 0 }')"
            if (( COUNT > 0 )); then
              echo "Another production workflow is queued; checkpoint $CHECKPOINT_SHA is retained and competing dispatch suppressed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          gh api --method POST repos/agurakakenai/akibazettai-schedule-calendar/actions/workflows/deploy-pages.yml/dispatches \
            -f ref=main -f "inputs[mode]=$CONTINUATION_MODE" -f "inputs[continuation_state]=$CHECKPOINT_SHA"
          echo "Continuation requested for published checkpoint $CHECKPOINT_SHA." >> "$GITHUB_STEP_SUMMARY"
