<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="アキバ絶対領域の公開情報をまとめた月間お給仕カレンダー"
    >
    <title>お給仕カレンダー | アキバ絶対領域</title>
    <style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
  --cp-store-s1: #b11f4b;
  --cp-store-s2: #7040b8;
  --cp-store-s3: #17795c;
  --cp-store-s4: #1f6fa8;
  --cp-store-s1-soft: rgba(177, 31, 75, 0.1);
  --cp-store-s2-soft: rgba(112, 64, 184, 0.1);
  --cp-store-s3-soft: rgba(23, 121, 92, 0.1);
  --cp-store-s4-soft: rgba(31, 111, 168, 0.1);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
  --cp-store-s1: #fd8ea1;
  --cp-store-s2: #c3a3f2;
  --cp-store-s3: #6ed3a8;
  --cp-store-s4: #7cc0f0;
  --cp-store-s1-soft: rgba(253, 142, 161, 0.16);
  --cp-store-s2-soft: rgba(195, 163, 242, 0.16);

    </style>
    <link rel="stylesheet" href="styles.css?v=71c377eecf">
    <script src="data/schedule.js?v=2f12115af8" defer></script>
    <script src="data/store-insights.js?v=233c839f67" defer></script>
    <script src="app.js?v=6d020d2cc0" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#calendar">カレンダーへ移動</a>
    <header class="site-header">
      <div>
        <p class="eyebrow">AKIBA ZETTAI RYOIKI</p>
        <h1>お給仕カレンダー</h1>
        <p class="header-copy">公開情報を、昼・夜ごとに見やすくまとめています。</p>
      </div>
    </header>

    <main class="page-shell">
      <aside class="filters-card" aria-labelledby="filters-title">
        <div class="filters-heading">
          <div>
            <p class="section-kicker">絞り込み</p>
            <h2 id="filters-title">表示条件</h2>
          </div>
          <button id="reset-filters" class="button button-secondary" type="button">
            リセット
          </button>
        </div>

        <fieldset class="mode-filter">
          <legend>表示モード</legend>
          <div class="mode-switch">
            <label>
              <input type="radio" name="view-mode" value="forecast" checked>
              <span>予測</span>
            </label>
            <label>
              <input type="radio" name="view-mode" value="roster">
              <span>誰いるか</span>
            </label>
            <label>
              <input type="radio" name="view-mode" value="maid">
              <span>この人はどこ</span>
            </label>
          </div>
          <p id="mode-help" class="mode-help"></p>
        </fieldset>

        <fieldset class="date-filters">
          <legend>日付</legend>
          <label>
            <span>開始日</span>
            <input id="date-from" type="date">
          </label>
          <label>
            <span>終了日</span>
            <input id="date-to" type="date">
          </label>
        </fieldset>

        <details id="maid-filter-details" class="maid-filter-details" open>
          <summary>
            <span>メイド</span>
            <span id="maid-filter-summary" class="maid-filter-summary"></span>
          </summary>
          <fieldset class="maid-filters">
            <legend class="visually-hidden">メイド</legend>
            <div class="filter-actions">
              <button id="select-all" class="text-button" type="button">すべて選択</button>
              <span aria-hidden="true">／</span>
              <button id="clear-all" class="text-button" type="button">すべて解除</button>
            </div>
            <label class="toggle-label">
              <input id="hide-kitchen" type="checkbox">
              <span>キッチンにゃんこを除く</span>
            </label>
            <div id="maid-checkboxes" class="checkbox-grid"></div>
          </fieldset>
        </details>
      </aside>

      <section class="calendar-card" aria-labelledby="month-title">
        <div class="calendar-toolbar">
          <button
            id="previous-month"
            class="icon-button"
            type="button"
            aria-label="前の月を表示"
          >
            <span aria-hidden="true">‹</span>
          </button>
          <div class="month-heading">
            <p class="section-kicker">月間表示</p>
            <h2 id="month-title"></h2>
          </div>
          <button
            id="next-month"
            class="icon-button"
            type="button"
            aria-label="次の月を表示"
          >
            <span aria-hidden="true">›</span>
          </button>
        </div>

        <p id="result-summary" class="result-summary" aria-live="polite"></p>
        <div
          id="calendar"
          class="calendar-scroll"
          role="region"
          aria-label="月間お給仕カレンダー"
          tabindex="0"
        ></div>

        <div class="calendar-notes">
          <p><span class="featured-key" aria-hidden="true"></span><strong>太字</strong>は記念日・生誕の主役です。</p>
          <p><span class="kitchen-key" aria-hidden="true">🍳</span>付きはキッチンにゃんこ（メイド服ではありません）です。</p>
          <p>空欄の日は「お給仕なし」ではなく、公開された確定情報が未確認であることを示します。</p>
          <p id="schedule-system-note" class="schedule-system-note" hidden></p>
          <p id="schedule-pending-note" class="schedule-system-note" hidden></p>
          <p id="last-updated" class="last-updated"></p>
        </div>
      </section>
    </main>

    <noscript>
      <p class="noscript-message">カレンダーの表示にはJavaScriptを有効にしてください。</p>
    </noscript>
  </body>
</html>
