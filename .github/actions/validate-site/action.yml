name: Validate static calendar
description: Offline data, rendering and publication checks
runs:
  using: composite
  steps:
    - uses: ./.github/actions/collector-python
    - shell: bash
      run: |
        python -I -B -c "import PIL.Image, cryptography.hazmat.primitives.ciphers.aead"
        node --check app.js
        node --test tests/validate-schedule.js tests/date-defaults.js tests/range-rendering.js tests/month-calendar.js tests/observed-shifts.js tests/validate-insights.js tests/store-outlook.js tests/headless-render.js tests/member-registry.js
        python -m unittest discover -s tools/tests -p "test_*.py"
        python tests/test-insights-tools.py
        python tools/check-readme.py
