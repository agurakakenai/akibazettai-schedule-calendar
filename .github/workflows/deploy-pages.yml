name: Validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 3-6,8-11 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "30 15 * * *"
    - cron: "30 21 12,28-31 * *"
    - cron: "30 2 1,13 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy, collect, apply approved saved evidence without HTTP, or probe
        type: choice
        options:
          - deploy
          - collect
          - personal
          - both
          - schedule
          - apply-saved
          - cost-sync
          - probe
        default: deploy
      saved_manifest:
        description: Approved bounded data-only JSON for apply-saved (expected main/state SHA required)
        type: string
        default: ""
      continuation_state:
        description: Saved checkpoint SHA from a successfully published finite collection chain
        type: string
        default: ""
      official_correction_dates:
        description: "collect only: up to 3 official service days YYYY-MM-DD,... within the last 7 days to backfill once"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate-site
      - name: Verify public staging
        run: python tools/pages.py stage --output _site --revision "$(git rev-parse HEAD)"

  probe:
    name: Verify public HTTP collection
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unseeded search and individual post metadata
        run: python tools/pages.py probe --report _probe-report.json

  collect:
    name: Collect with durable state
    if: >-
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'collect' || inputs.mode == 'personal' || inputs.mode == 'both' || inputs.mode == 'schedule' ||
         inputs.mode == 'apply-saved' || inputs.mode == 'cost-sync')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    outputs:
      continuation_ready: ${{ steps.collection.outputs.continuationReady }}
      state_commit: ${{ steps.collection.outputs.stateCommit }}
      continuation_mode: ${{ steps.collection.outputs.continuationMode }}
      attention: ${{ steps.collection.outputs.attention }}
      failed_components: ${{ steps.collection.outputs.failedComponents }}
      failure_reason: ${{ steps.collection.outputs.reason }}
      official_status: ${{ steps.collection.outputs.officialCollectionStatus }}
      official_code: ${{ steps.collection.outputs.officialCollectionCode }}
      official_reason: ${{ steps.collection.outputs.officialFailureReason }}
      personal_status: ${{ steps.collection.outputs.personalCollectionStatus }}
      personal_code: ${{ steps.collection.outputs.personalCollectionCode }}
      personal_reason: ${{ steps.collection.outputs.personalFailureReason }}
      schedule_status: ${{ steps.collection.outputs.halfMonthCollectionStatus }}
      schedule_code: ${{ steps.collection.outputs.halfMonthCollectionCode }}
      schedule_reason: ${{ steps.collection.outputs.scheduleFailureReason }}
      schedule_capacity: ${{ steps.collection.outputs.scheduleCapacityLimit }}
    steps:
      # A queued collector must use current code, not the old triggering commit.
      - name: Check out current production code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Route the triggering event without using the runner clock
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export RUN_CREATED_AT
          python tools/collection-routing.py
          echo "RUN_CREATED_AT=$RUN_CREATED_AT" >> "$GITHUB_ENV"
      - name: Install declared image collection dependencies
        if: steps.route.outputs.halfMonthCacheRequired == 'true'
        uses: ./.github/actions/collector-python
      - name: Restore encrypted schedule evidence outside the checkout
        if: steps.route.outputs.halfMonthCacheRequired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_EVIDENCE_KEY: ${{ secrets.SCHEDULE_EVIDENCE_KEY }}
        run: |
          python tools/schedule-cache-artifact.py --output "$RUNNER_TEMP/schedule-evidence.zip"
          if [[ -f "$RUNNER_TEMP/schedule-evidence.zip" ]]; then
            python tools/restore-schedule-cache.py --archive "$RUNNER_TEMP/schedule-evidence.zip" --cache-dir "$RUNNER_TEMP/_private-evidence"
          fi
      - name: Authenticate read-only Azure cost access
        id: azure-cost-login
        if: >-
          steps.route.outputs.collectionMode != 'apply-saved' &&
          vars.AZURE_COST_CLIENT_ID != '' && vars.AZURE_COST_TENANT_ID != '' &&
          vars.AZURE_COST_SUBSCRIPTION_ID != ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_COST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_COST_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_COST_SUBSCRIPTION_ID }}
      - name: Collect with durable state
        id: collection
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_COST_CLIENT_ID: ${{ vars.AZURE_COST_CLIENT_ID }}
          AZURE_COST_TENANT_ID: ${{ vars.AZURE_COST_TENANT_ID }}
          AZURE_COST_SUBSCRIPTION_ID: ${{ vars.AZURE_COST_SUBSCRIPTION_ID }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          COLLECTION_MODE: ${{ steps.route.outputs.collectionMode }}
          COLLECTION_KIND: ${{ steps.route.outputs.collectionKind }}
          COLLECTION_SLOT: ${{ steps.route.outputs.collectionSlot }}
          COLLECTION_SLOT_ID: ${{ steps.route.outputs.collectionSlotId }}
          COLLECTION_DATE: ${{ steps.route.outputs.collectionDate }}
          CONTINUATION_STATE: ${{ inputs.continuation_state }}
          OFFICIAL_CORRECTION_DATES: ${{ inputs.official_correction_dates }}
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          APPLY_SAVED_MANIFEST: ${{ inputs.saved_manifest }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
          SCHEDULE_EVIDENCE_CACHE: ${{ runner.temp }}/_private-evidence/cache.bin
          SCHEDULE_EVIDENCE_KEY: ${{ steps.route.outputs.halfMonthCacheRequired == 'true' && secrets.SCHEDULE_EVIDENCE_KEY || '' }}
          # Cloud strips Azure configuration from Git, restore, and all non-AI children.
          PERSONAL_ANALYSIS_BACKEND: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both') && 'azure' || 'rules' }}
          AZURE_OPENAI_API_KEY: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && secrets.AZURE_OPENAI_API_KEY || '' }}
          AZURE_OPENAI_ENDPOINT: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && vars.AZURE_OPENAI_ENDPOINT || '' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ (steps.route.outputs.collectionMode == 'personal' || steps.route.outputs.collectionMode == 'both' || steps.route.outputs.collectionMode == 'schedule' || steps.route.outputs.collectionMode == 'daily-guidance' || (steps.route.outputs.collectionMode == 'collect' && vars.DAILY_GUIDANCE_ENABLED == 'true')) && vars.AZURE_OPENAI_DEPLOYMENT || '' }}
        run: python tools/cloud-collection.py --mode "$COLLECTION_MODE" --output data/observed-shifts.json --recovery-dir _recovery-state
      - name: Detect encrypted checkpoint for retention
        id: evidence
        if: always() && steps.route.outputs.halfMonthCacheRequired == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/_private-evidence/cache.bin" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve only encrypted schedule evidence
        if: always() && steps.evidence.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: schedule-evidence-encrypted-v1
          path: ${{ runner.temp }}/_private-evidence/cache.bin
          retention-days: 7
          if-no-files-found: error
      - name: Warn when verified data is published with incomplete collection
        if: >-
          steps.collection.outputs.collectionStatus == 'partial' ||
          steps.collection.outputs.collectionStatus == 'unavailable' ||
          steps.collection.outputs.personalCollectionStatus == 'paused' ||
          steps.collection.outputs.personalCollectionStatus == 'budget-exhausted' ||
          steps.collection.outputs.halfMonthCollectionStatus == 'paused' ||
          steps.collection.outputs.halfMonthCollectionStatus == 'budget-exhausted'
        run: echo "::warning::Collection was incomplete or paused; only saved, verified facts will be published."
      - name: Preserve data for explicit recovery after a failure
        if: failure() && hashFiles('_recovery-state/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: collector-recovery-${{ github.run_id }}
          path: _recovery-state
          retention-days: 30

  build:
    name: Validate and stage current production site
    needs: collect
    outputs:
      continuation_ready: ${{ steps.restore.outputs.continuationReady }}
      state_commit: ${{ steps.restore.outputs.stateCommit }}
      continuation_mode: ${{ steps.restore.outputs.continuationMode }}
    if: >-
      always() && !cancelled() &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'deploy' || inputs.mode == 'collect' ||
         inputs.mode == 'personal' || inputs.mode == 'both' || inputs.mode == 'schedule' || inputs.mode == 'apply-saved'))) &&
      (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Restore latest observations for every deployment
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          DAILY_GUIDANCE_ENABLED: ${{ vars.DAILY_GUIDANCE_ENABLED || 'false' }}
          HALF_MONTH_SCHEDULE_ENABLED: ${{ vars.HALF_MONTH_SCHEDULE_ENABLED || 'false' }}
        run: python tools/cloud-collection.py --mode restore --output data/observed-shifts.json
      - uses: ./.github/actions/validate-site
      - name: Stage only public frontend files
        run: python tools/pages.py stage --output _site --revision "$(git rev-parse HEAD)"
      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy static site
    needs: build
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      inputs.mode != 'probe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the artifact validated in this run
        id: deployment
        uses: actions/deploy-pages@v4

  continue-collection:
    name: Continue a published finite checkpoint
    needs: [collect, build, deploy]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.collect.result == 'success' || needs.collect.result == 'skipped') &&
      needs.deploy.result == 'success' &&
      needs.build.outputs.continuation_ready == 'true' &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the published checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_SHA: ${{ needs.build.outputs.state_commit }}
          CONTINUATION_MODE: ${{ needs.build.outputs.continuation_mode }}
        run: |
          [[ "$CHECKPOINT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CONTINUATION_MODE" == "personal" || "$CONTINUATION_MODE" == "both" || "$CONTINUATION_MODE" == "schedule" ]] || exit 1
          for STATUS in queued pending waiting; do
            COUNT="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs?branch=main&status=$STATUS&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .event != \"pull_request\")] | length" |
              awk '{ total += $1 } END { print total + 0 }')"
            if (( COUNT > 0 )); then
              echo "Another production workflow is queued; checkpoint $CHECKPOINT_SHA is retained and competing dispatch suppressed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          gh api --method POST repos/agurakakenai/akibazettai-schedule-calendar/actions/workflows/deploy-pages.yml/dispatches \
            -f ref=main -f "inputs[mode]=$CONTINUATION_MODE" -f "inputs[continuation_state]=$CHECKPOINT_SHA"
          echo "Continuation requested for published checkpoint $CHECKPOINT_SHA." >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Keep one collector alert issue current
    needs: [collect, build, deploy]
    if: >-
      always() && !cancelled() &&
      github.repository == 'agurakakenai/akibazettai-schedule-calendar' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      inputs.mode != 'probe'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create, update or close the single alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          COLLECT: ${{ needs.collect.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          ATTENTION: ${{ needs.collect.outputs.attention }}
          REASON: ${{ needs.collect.outputs.failure_reason }}
          COMPONENTS: ${{ needs.collect.outputs.failed_components }}
          OFFICIAL_STATUS: ${{ needs.collect.outputs.official_status }}
          OFFICIAL_CODE: ${{ needs.collect.outputs.official_code }}
          OFFICIAL_REASON: ${{ needs.collect.outputs.official_reason }}
          PERSONAL_STATUS: ${{ needs.collect.outputs.personal_status }}
          PERSONAL_CODE: ${{ needs.collect.outputs.personal_code }}
          PERSONAL_REASON: ${{ needs.collect.outputs.personal_reason }}
          SCHEDULE_STATUS: ${{ needs.collect.outputs.schedule_status }}
          SCHEDULE_CODE: ${{ needs.collect.outputs.schedule_code }}
          SCHEDULE_REASON: ${{ needs.collect.outputs.schedule_reason }}
          SCHEDULE_CAPACITY: ${{ needs.collect.outputs.schedule_capacity }}
        run: |
          # Only fixed tokens reach the issue; never logs, messages, paths or data.
          # Each component (official, personal, schedule, publication) stays open until a later run
          # of the SAME component succeeds; another component's success never closes it.
          for NAME in COLLECT BUILD DEPLOY; do
            [[ "${!NAME}" =~ ^(success|failure|cancelled|skipped)$ ]] || printf -v "$NAME" '%s' unknown
          done
          for NAME in REASON OFFICIAL_REASON PERSONAL_REASON SCHEDULE_REASON; do
            [[ "${!NAME}" =~ ^[a-z_]{1,64}$ ]] || printf -v "$NAME" '%s' none
          done
          for NAME in OFFICIAL_STATUS PERSONAL_STATUS SCHEDULE_STATUS; do
            [[ "${!NAME}" =~ ^[a-z-]{1,32}$ ]] || printf -v "$NAME" '%s' none
          done
          for NAME in OFFICIAL_CODE PERSONAL_CODE SCHEDULE_CODE; do
            [[ "${!NAME}" =~ ^-?[0-9]{1,3}$ ]] || printf -v "$NAME" '%s' -1
          done
          [[ "$COMPONENTS" =~ ^[a-z-]{1,64}$ ]] || COMPONENTS=none
          # A reached queue bound (e.g. queue_limit, reading_capacity) is surfaced, never silently absorbed.
          [[ "$SCHEDULE_CAPACITY" =~ ^[a-z_]{1,64}(-[a-z_]{1,64}){0,3}$ ]] || SCHEDULE_CAPACITY=""
          [[ "$EVENT" =~ ^[a-z_]{1,32}$ ]] || EVENT=unknown
          RUN_ID=0
          if [[ "$RUN_URL" =~ /runs/([0-9]{1,20})$ ]]; then RUN_ID="${BASH_REMATCH[1]}"; fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TITLE="Collector needs attention"
          NUMBER="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [[ -n "$NUMBER" && ! "$NUMBER" =~ ^[0-9]{1,9}$ ]]; then NUMBER=""; fi
          declare -A FAIL_REASON FAIL_COUNT FAIL_FIRST FAIL_RUN
          KNOWN=(official personal schedule publication)
          STATE_FOUND=false
          if [[ -n "$NUMBER" ]]; then
            STATE_LINE="$(gh issue view "$NUMBER" --json body --jq .body \
              | grep -m1 -E '^<!-- alert-state( [a-z]+=[a-z_]+:[0-9]+:[0-9TZ:-]+:[0-9]+)* -->$' || true)"
            if [[ -n "$STATE_LINE" ]]; then
              STATE_FOUND=true
              for ITEM in ${STATE_LINE}; do
                [[ "$ITEM" =~ ^(official|personal|schedule|publication)=([a-z_]{1,64}):([0-9]{1,6}):([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z):([0-9]{1,20})$ ]] || continue
                FAIL_REASON[${BASH_REMATCH[1]}]="${BASH_REMATCH[2]}"
                FAIL_COUNT[${BASH_REMATCH[1]}]="${BASH_REMATCH[3]}"
                FAIL_FIRST[${BASH_REMATCH[1]}]="${BASH_REMATCH[4]}"
                FAIL_RUN[${BASH_REMATCH[1]}]="${BASH_REMATCH[5]}"
              done
            fi
          fi
          CHANGED=false
          failed() {
            if [[ "${FAIL_REASON[$1]:-}" == "$2" ]]; then
              FAIL_COUNT[$1]=$(( ${FAIL_COUNT[$1]} < 999999 ? ${FAIL_COUNT[$1]} + 1 : 999999 ))
            else
              FAIL_REASON[$1]="$2"; FAIL_COUNT[$1]=1; FAIL_FIRST[$1]="$NOW"
            fi
            FAIL_RUN[$1]="$RUN_ID"; CHANGED=true
          }
          recovered() {
            if [[ -n "${FAIL_REASON[$1]:-}" ]]; then
              unset "FAIL_REASON[$1]" "FAIL_COUNT[$1]" "FAIL_FIRST[$1]" "FAIL_RUN[$1]"; CHANGED=true
            fi
          }
          PUBLISHED=false
          if [[ "$COLLECT" == success && "$BUILD" == success && "$DEPLOY" == success ]]; then PUBLISHED=true; fi
          for C in official personal schedule; do
            UPPER="${C^^}"; STATUS_NAME="${UPPER}_STATUS"; CODE_NAME="${UPPER}_CODE"; REASON_NAME="${UPPER}_REASON"
            if [[ "-$COMPONENTS-" == *"-$C-"* ]]; then
              REASON_C="${!REASON_NAME}"; if [[ "$REASON_C" == none ]]; then REASON_C=component_failure; fi
              failed "$C" "$REASON_C"
            elif [[ "$C" == schedule && -n "$SCHEDULE_CAPACITY" ]]; then
              failed schedule "${SCHEDULE_CAPACITY%%-*}"
            elif [[ "$PUBLISHED" == true && "${!CODE_NAME}" =~ ^[0-9]+$ \
                    && "${!STATUS_NAME}" =~ ^(ok|partial|no-new|no-results|budget-exhausted|outside-window|paused)$ ]]; then
              recovered "$C"
            fi
          done
          if [[ "$COLLECT" == failure || "$BUILD" == failure || "$DEPLOY" == failure \
                || ( "$ATTENTION" == true && "$COMPONENTS" == none ) ]]; then
            PUBLICATION_REASON="$REASON"; if [[ "$PUBLICATION_REASON" == none ]]; then PUBLICATION_REASON=job_failure; fi
            failed publication "$PUBLICATION_REASON"
          elif [[ "$PUBLISHED" == true ]]; then
            recovered publication
          fi
          ACTIVE=()
          for C in "${KNOWN[@]}"; do if [[ -n "${FAIL_REASON[$C]:-}" ]]; then ACTIVE+=("$C"); fi; done
          if (( ${#ACTIVE[@]} )); then
            if [[ "$CHANGED" == false && -n "$NUMBER" && "$STATE_FOUND" == true ]]; then exit 0; fi
            STATE="<!-- alert-state"
            LINES=()
            for C in "${ACTIVE[@]}"; do
              STATE+=" $C=${FAIL_REASON[$C]}:${FAIL_COUNT[$C]}:${FAIL_FIRST[$C]}:${FAIL_RUN[$C]}"
              LINES+=("- $C: reason=${FAIL_REASON[$C]}; consecutive failures=${FAIL_COUNT[$C]}; first failed (UTC)=${FAIL_FIRST[$C]}; latest failed run: ${RUN_URL%/runs/*}/runs/${FAIL_RUN[$C]}")
            done
            STATE+=" -->"
            BODY="$(printf '%s\n' \
              "$STATE" \
              'The collector or publication needs attention. This issue is updated in place and closed only after every failed component below has a later successful run of the same component.' \
              '' \
              "${LINES[@]}" \
              '' \
              "- Latest run: $RUN_URL" \
              "- Updated (UTC): $NOW" \
              "- Event: $EVENT" \
              "- Jobs: collect=$COLLECT, build=$BUILD, deploy=$DEPLOY" \
              "- Collector reason: $REASON" \
              "- Contained or isolated components in this run: $COMPONENTS" \
              '' \
              'If the reason is unresolved_lease or a component failure was not contained, follow README "保存失敗時の回復". Details are in the run job summary.')"
            if [[ -n "$NUMBER" ]]; then
              gh issue edit "$NUMBER" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          elif [[ -n "$NUMBER" && ( "$CHANGED" == true || "$STATE_FOUND" == false ) && "$PUBLISHED" == true ]]; then
            gh issue close "$NUMBER" --comment "Recovered: every failed component later succeeded in its own run ($RUN_URL)."
          fi
